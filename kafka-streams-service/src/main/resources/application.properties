server.port=8083
spring.application.name=kafka-streams-service

spring.cloud.stream.bindings.kStreamFunction-in-0.destination=R1
spring.cloud.stream.bindings.kStreamFunction-out-0.destination=R2

spring.cloud.stream.kafka.streams.binder.configuration.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.cloud.stream.kafka.streams.binder.configuration.default.value.serde=org.springframework.kafka.support.serializer.JsonSerde

spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000
spring.cloud.stream.kafka.streams.binder.configuration.application.id=kafka-streams-service-id

spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.streams.binder.brokers=localhost:9092

spring.kafka.properties.spring.json.trusted.packages=*

management.endpoints.web.exposure.include=*

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# Streams state store: page-count-store
